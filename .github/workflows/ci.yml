name: CI

on:
  pull_request:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    name: Verify
    # Self-hosted per project-conventions PC-03 — cloud runners are forbidden in
    # private repos (billing).
    runs-on: [self-hosted, Linux]
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Installs bun rather than assuming the runner has it, so CI doesn't break
      # the first time this lands on a runner that was never provisioned for it.
      - name: Setup bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Collision detection tests
        run: bun test

      - name: Generated tree matches shared/
        # The check that stops a rule from living in one harness and nowhere
        # else. If this fails, the fix is to move the rule into shared/ and
        # regenerate — never to edit the generated file.
        run: bun build/emit.mjs --check

      # Agents already typecheck/build the web UI locally; a green Verify on a
      # TSX PR said nothing about compilation until this step existed (OPS-243).
      - name: Typecheck and build event-runtime/web
        run: cd event-runtime/web && bun install --frozen-lockfile && bun run build

      - name: Schedule renders
        run: bun deploy/gen.mjs

      - name: Supervisor lists jobs
        # Cheap smoke test: proves schedule.yaml parses and every job is
        # addressable before anyone tries to run one.
        run: bun orchestrator/run.mjs --list

      - name: Manifests parse
        run: |
          for f in .claude-plugin/marketplace.json plugins/core/.claude-plugin/plugin.json; do
            bun -e "JSON.parse(await Bun.file('$f').text())" || exit 1
          done
