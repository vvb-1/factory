# The one source of truth for every recurring job.
#
# `bun deploy/gen.mjs` renders these into ~/Library/LaunchAgents/*.plist.
# Never hand-edit a generated plist — change it here and regenerate, or the next
# regeneration silently reverts your edit.
#
# Loops and their rationale: linear.md §14.
#
# ┌──────────────────────────────────────────────────────────────────────────┐
# │ EVERYTHING IS DISABLED ON PURPOSE (2026-08-03).                          │
# │                                                                          │
# │ Standing policy for now: the factory runs in the FOREGROUND, watched.    │
# │ No launchd job may act on Linear, git, or CI without someone looking at  │
# │ it. Nothing here has eval coverage yet, per-agent identity doesn't exist │
# │ (OPS-40), and the reaper has already demonstrated it can act on 31       │
# │ tickets from one bad predicate. Trust is earned one loop at a time.      │
# │                                                                          │
# │ Enabling anything here is a deliberate decision, not a default. Flip one │
# │ job, watch it for a week, then consider the next.                        │
# └──────────────────────────────────────────────────────────────────────────┘

defaults:
  label_prefix: com.wattmind
  log_dir: ~/Library/Logs
  # Don't fire a burst of catch-up runs when the laptop wakes from sleep.
  run_at_load: false

jobs:
  # ---------------------------------------------------------------- reaper ---
  # Returns crashed agents' Linear claims to Todo. Only touches tickets carrying
  # ai:in-progress / agent:* -- an In Progress ticket without those labels is a
  # human's work, and unassigning it would be far worse than the crashed agent
  # this cleans up after.
  #
  # Installed by hand 2026-08-03; adopted here so it stops being an orphan.
  - name: linear-reaper
    every: 15m
    dry_command: bun orchestrator/reaper.mjs
    command: bun orchestrator/reaper.mjs --apply
    enabled: false
    why: >
      Threshold is 45 minutes of silence, so 15m would sample it 3x. Disabled
      under the foreground policy above — it was loaded on 2026-08-03 and
      unloaded the same day. Run it by hand instead, and prefer the dry run
      first: `bun orchestrator/reaper.mjs` shows what it
      would reclaim, `--apply` does it. Without this running, a crashed agent
      holds its ticket until someone notices — acceptable while every run is
      watched, and the first thing to re-enable when it isn't.

  # ============================================================================
  # The loop. Commands are repo-AGNOSTIC verbs; `--repo` supplies the targets,
  # so adding legalease later is `--repo bj29,legalease` rather than a second
  # copy of every job. Repo-specific knowledge lives in the repo (AGENTS.md,
  # docs/product-decisions.md) and in config/repos.yaml — never in the command.
  #
  #   triage  ->  dispatch  ->  merge
  #
  # Only bj29 is targeted today: it is the one repo satisfying PC-15
  # (industrialized worktrees), which is what makes concurrent agents safe.
  # coach-wattz and legalease join the --repo list when CW-363/CLNT-609 land.
  #
  # WHY THE SHORT CADENCES: every stage has a `gate_command` — one cheap Linear
  # query that exits 0 when there is work and 1 when there isn't. Polling is
  # nearly free; spawning an agent costs budget. So the loop checks every few
  # minutes and acts only when something is waiting, which is what makes it feel
  # continuous instead of batch. Follow-up work filed during dispatch gets
  # triaged minutes later, not at the next 6-hour boundary.
  #
  # dry_command for every stage is the read-only queue view: "what would this
  # do" never means "spawn an agent and find out".
  # ============================================================================

  # 1. INTAKE. Usually the binding constraint — a deep Triage pile with an empty
  #    agent-ready queue means dispatching harder cannot help.
  - name: triage
    every: 5m
    gate_command: bun orchestrator/queue.mjs --repo bj29 --gate triage
    dry_command: bun orchestrator/queue.mjs --repo bj29
    command: runners/run-agent.sh --repo bj29 --command factory-triage --read-only
    enabled: false
    why: >
      Turns Triage tickets into ai:agent-ready ones by exploring the codebase,
      and batches the genuinely human questions into one notification instead of
      a ping per ticket. Read-only against the repo — it needs the code to write
      Source File Pointers and Owned Paths, but never a worktree.

  # 2. EXECUTE. Rolling dispatch under the per-repo in-flight cap; Owned Paths
  #    decide what can run together. The gate refuses to spawn when the cap is
  #    full or nothing is startable, so an agent never wakes to learn nothing.
  - name: dispatch
    every: 5m
    gate_command: bun orchestrator/queue.mjs --repo bj29 --gate dispatch
    dry_command: bun orchestrator/queue.mjs --repo bj29
    command: runners/run-agent.sh --repo bj29 --command factory-work
    enabled: false
    why: >
      Claims agent-ready tickets, works them in per-ticket worktrees
      (bin/worktree-up.sh), verifies, and opens PRs against develop.

  # 3. LAND. Merging is always serialized — two PRs landing in one base within
  #    seconds produce a base-CI failure belonging to neither.
  - name: merge
    every: 10m
    gate_command: bun orchestrator/queue.mjs --repo bj29 --gate merge
    dry_command: bun orchestrator/queue.mjs --repo bj29
    command: runners/run-agent.sh --repo bj29 --command factory-merge
    enabled: false
    why: >
      Reviews In Review PRs as their CI finishes, fixes what is mechanical,
      merges what qualifies into develop, and moves tickets to Done once base CI
      and the dev smoke check are green. Escalation list still applies: payments,
      auth and migrations never auto-merge in this client repo.

  # 4. RECLAIM. Worktrees whose tickets finished. The merge stage is supposed to
  #    tear its own down, but crashed runs, hand-merges and tickets closed in
  #    Linear all leave orphans — and an orphan looks exactly like live work, so
  #    nothing notices until the disk does. bj29 had 20 of them at 89% full.
  - name: janitor
    every: 1h
    gate_command: bun orchestrator/janitor.mjs --repo bj29 --gate
    dry_command: bun orchestrator/janitor.mjs --repo bj29
    command: bun orchestrator/janitor.mjs --repo bj29 --apply
    enabled: false
    why: >
      Calls the repo's worktree-down.sh WITHOUT --force, so anything holding
      uncommitted or unpushed work refuses to be removed and is reported
      instead. Never add --force: losing an agent's unpushed work is far worse
      than the disk it occupies.
