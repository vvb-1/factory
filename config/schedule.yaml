# The one source of truth for every recurring job.
#
# `bun deploy/gen.mjs` renders these into ~/Library/LaunchAgents/*.plist.
# Never hand-edit a generated plist — change it here and regenerate, or the next
# regeneration silently reverts your edit.
#
# Loops and their rationale: linear.md §14.
#
# ┌──────────────────────────────────────────────────────────────────────────┐
# │ EVERYTHING IS DISABLED ON PURPOSE (2026-08-03).                          │
# │                                                                          │
# │ Standing policy for now: the factory runs in the FOREGROUND, watched.    │
# │ No launchd job may act on Linear, git, or CI without someone looking at  │
# │ it. Nothing here has eval coverage yet, per-agent identity doesn't exist │
# │ (OPS-40), and the reaper has already demonstrated it can act on 31       │
# │ tickets from one bad predicate. Trust is earned one loop at a time.      │
# │                                                                          │
# │ Enabling anything here is a deliberate decision, not a default. Flip one │
# │ job, watch it for a week, then consider the next.                        │
# └──────────────────────────────────────────────────────────────────────────┘

defaults:
  label_prefix: com.wattmind
  log_dir: ~/Library/Logs
  # Don't fire a burst of catch-up runs when the laptop wakes from sleep.
  run_at_load: false

jobs:
  # ---------------------------------------------------------------- reaper ---
  # Returns crashed agents' Linear claims to Todo. Only touches tickets carrying
  # ai:in-progress / agent:* -- an In Progress ticket without those labels is a
  # human's work, and unassigning it would be far worse than the crashed agent
  # this cleans up after.
  #
  # Installed by hand 2026-08-03; adopted here so it stops being an orphan.
  - name: linear-reaper
    every: 15m
    dry_command: bun orchestrator/reaper.mjs
    command: bun orchestrator/reaper.mjs --apply
    enabled: false
    why: >
      Threshold is 45 minutes of silence, so 15m would sample it 3x. Disabled
      under the foreground policy above — it was loaded on 2026-08-03 and
      unloaded the same day. Run it by hand instead, and prefer the dry run
      first: `bun orchestrator/reaper.mjs` shows what it
      would reclaim, `--apply` does it. Without this running, a crashed agent
      holds its ticket until someone notices — acceptable while every run is
      watched, and the first thing to re-enable when it isn't.

  # ------------------------------------------------------------ spec synth ---
  # The queue starves at specification, not execution: 147 Triage vs 12
  # dispatchable when this repo was created. This is the loop that fixes it.
  # Disabled until the ticket-spec skill has eval coverage -- an auto-specced
  # ticket that looks complete but whose Verification Command doesn't run costs
  # a full agent run to discover.
  - name: spec-synth
    every: 6h
    command: bash runners/run-agent.sh --skill ticket-spec
    enabled: false
    why: Turns Triage into ai:agent-ready without a human. Enable after evals.

  # ------------------------------------------------------------- dispatch ----
  # Disabled until the worktree scripts exist in the repos it would dispatch to
  # (CW-363, CLNT-609). Dispatching agents into repos with no port/database
  # isolation is how two agents end up sharing one dev database.
  - name: dispatch
    every: 20m
    command: bun orchestrator/tick.mjs
    enabled: false
    why: Rolling dispatch under the in-flight cap. Needs PC-15 in target repos.

  # --------------------------------------------------------- merge sitter ----
  - name: merge-babysitter
    every: 30m
    command: bash runners/run-agent.sh --command merge
    enabled: false
    why: >
      Reviews In Review PRs as their CI finishes instead of at end of session.
      Merging stays serialized -- one PR at a time, base CI + smoke green before
      the next.
